[workspace]
description = "Style definitions for nice terminal layouts."
authors = ["Mikhail Tavarez <miktavarez@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/thatstoasty/mog"
repository = "https://github.com/thatstoasty/mog"
preview = ["pixi-build"]

[tasks]
tests = "sh -c 'find test -name \"test_*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
benchmarks = "mojo -D ASSERT=all -I . benchmarks/run.mojo --print-relative"
examples = "sh -c 'find examples -name \"*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
test_readme_examples = "python3 utils/test_readme_examples.py"

# Linting and Formatting
lint_docs = "mojo doc --Werror --diagnose-missing-doc-strings -o /dev/null ./mog"
format = "mojo format mog test examples benchmarks --line-length 120"

[package]
name = "mog"
version = "0.3.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[dependencies]
mojo = ">=1.0.0,<1.1.0"
mist = { git = "https://github.com/thatstoasty/mist.git", tag = "v0.3.4" }

[package.build-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"
mist = { git = "https://github.com/thatstoasty/mist.git", tag = "v0.3.4" }

[package.host-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"
mist = { git = "https://github.com/thatstoasty/mist.git", tag = "v0.3.4" }
